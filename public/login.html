<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2); width: 280px; }
  h1 { margin: 0 0 20px; font-size: 22px; color: #1f3a5f; }
  input, button { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px; font-size: 16px; }
  button { background: #1f3a5f; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #erro { color: #c0392b; min-height: 20px; }
</style>
</head>
<body>
<form id="f">
  <h1>Controle de Atendimento</h1>
  <input id="login" placeholder="Login" autocomplete="username" required autofocus>
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
  <div id="erro"></div>
  <button>Entrar</button>
  <a href="/cadastro" style="color:#1f3a5f;font-size:14px">Sou técnico e quero me cadastrar</a>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login: login.value, senha: senha.value }),
  });
  const d = await r.json();
  if (r.ok) location.href = d.destino;
  else document.getElementById('erro').textContent = d.erro;
};
</script>
</body>
</html>
